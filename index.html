<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Owner Activity Report</title>

    <!-- Zoho CRM Widget SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #1f2937;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .refresh-section {
            margin-top: 15px;
        }

        #refreshButton {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #refreshButton:hover {
            background: #1d4ed8;
        }

        #refreshButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        .report-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .report-header h2 {
            margin: 0;
            font-size: 20px;
            color: #1f2937;
        }

        .report-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #ownerFilter {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 13px;
            background: #ffffff;
            min-width: 160px;
        }

        .last-updated {
            font-size: 12px;
            color: #6b7280;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 650px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        table {
            border-collapse: collapse;
            min-width: 2200px;
            width: max-content;
            background: #ffffff;
        }

        th,
        td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
            white-space: nowrap;
            font-size: 12px;
        }

        th {
            background: #e5e7eb;
            font-weight: bold;
            color: #111827;
        }

        thead tr:first-child th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #dbeafe;
        }

        thead tr:nth-child(2) th {
            position: sticky;
            top: 38px;
            z-index: 2;
            background: #eff6ff;
        }

        tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        tbody tr:hover {
            background: #f3f4f6;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        .error {
            padding: 20px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 14px;
        }

        .success {
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            color: #166534;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .summary-cards {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .report-section {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>Account Owner Activity Report</h1>

        <p>
            Owner-wise Account, Deal and Activity Summary
        </p>

        <div class="refresh-section">

            <button id="refreshButton" onclick="loadReport()">
                Refresh Report
            </button>

        </div>

    </div>


    <!-- SUMMARY CARDS -->
    <div class="summary-cards">

        <div class="card">
            <div class="card-title">
                Total Accounts
            </div>

            <div class="card-value" id="totalAccounts">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Accounts With Deal
            </div>

            <div class="card-value" id="accountsWithDeals">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Accounts Without Deal
            </div>

            <div class="card-value" id="accountsWithoutDeals">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Touched Accounts
            </div>

            <div class="card-value" id="touchedAccounts">
                -
            </div>
        </div>

    </div>


    <!-- REPORT -->
    <div class="report-section">

        <div class="report-header">

            <h2>
                Account Owner Summary
            </h2>

            <div class="report-header-controls">

                <select id="ownerFilter" onchange="filterByOwner()">
                    <option value="">All Owners</option>
                </select>

                <div
                    class="last-updated"
                    id="lastUpdated">
                    Last Updated: -
                </div>

            </div>

        </div>


        <div id="report">

            <div class="loading">
                Loading report...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   STATE
   ========================================================= */

var lastReportData = null;


/* =========================================================
   ZOHO PAGE LOAD
   ========================================================= */

ZOHO.embeddedApp.on(
    "PageLoad",
    function(data) {

        console.log(
            "======================================"
        );

        console.log(
            "ZOHO WIDGET PAGE LOADED"
        );

        console.log(
            "PAGE LOAD DATA:",
            data
        );

        console.log(
            "======================================"
        );

        loadReport();
    }
);


/* =========================================================
   INITIALIZE ZOHO WIDGET
   ========================================================= */

ZOHO.embeddedApp.init();


/* =========================================================
   LOAD REPORT
   ========================================================= */

function loadReport() {

    var button =
        document.getElementById(
            "refreshButton"
        );

    var report =
        document.getElementById(
            "report"
        );


    button.disabled = true;

    button.innerText =
        "Loading...";


    report.innerHTML =
        '<div class="loading">' +
        'Loading report from Zoho CRM...' +
        '</div>';


    console.log(
        "======================================"
    );

    console.log(
        "CALLING PYTHON FUNCTION"
    );

    console.log(
        "Function API Name: account_owner_report_reader"
    );

    console.log(
        "======================================"
    );


    /*
       Standalone Function arguments
    */

    var req_data = {

        "arguments":
            JSON.stringify({})

    };


    console.log(
        "REQUEST DATA:",
        req_data
    );


    /*
       Execute the lightweight reader function
       (reads the cache written by the scheduled writer function)
    */

    ZOHO.CRM.FUNCTIONS.execute(

        "account_owner_report_reader",

        req_data

    )

    .then(

        function(response) {

            console.log(
                "======================================"
            );

            console.log(
                "FULL ZOHO FUNCTION RESPONSE"
            );

            console.log(
                "======================================"
            );

            console.log(
                response
            );


            try {

                console.log(
                    "RESPONSE JSON:"
                );

                console.log(
                    JSON.stringify(
                        response,
                        null,
                        2
                    )
                );

            }
            catch (jsonError) {

                console.error(
                    "Could not stringify response:",
                    jsonError
                );

            }


            processResponse(response);

        }

    )

    .catch(

        function(error) {

            console.error(
                "======================================"
            );

            console.error(
                "PYTHON FUNCTION ERROR"
            );

            console.error(
                error
            );

            console.error(
                "======================================"
            );


            var errorMessage =
                "Unable to load Python report.";


            try {

                errorMessage =
                    JSON.stringify(
                        error,
                        null,
                        2
                    );

            }
            catch (e) {

                errorMessage =
                    String(error);

            }


            report.innerHTML =

                '<div class="error">' +

                '<b>Unable to load Python report.</b>' +

                '<br><br>' +

                '<pre style="white-space:pre-wrap;">' +

                escapeHtml(
                    errorMessage
                ) +

                '</pre>' +

                '</div>';

        }

    )

    .finally(

        function() {

            button.disabled = false;

            button.innerText =
                "Refresh Report";

        }

    );

}


/* =========================================================
   PROCESS ZOHO FUNCTION RESPONSE
   ========================================================= */

function processResponse(response) {

    console.log("======================================");
    console.log("PROCESSING RESPONSE");
    console.log("======================================");

    console.log("FULL RESPONSE:");
    console.log(response);


    /*
       -------------------------------------------------------
       Find the Python output anywhere inside the
       Zoho response object.
       -------------------------------------------------------
    */

    function findPythonOutput(obj, path, depth) {

        if (depth > 10) {
            return null;
        }

        if (
            obj === null ||
            obj === undefined
        ) {
            return null;
        }


        if (typeof obj === "string") {

            var text = obj.trim();

            try {

                var parsed =
                    JSON.parse(text);

                var result =
                    findPythonOutput(
                        parsed,
                        path + " [parsed]",
                        depth + 1
                    );

                if (result) {
                    return result;
                }

            }
            catch (e) {
                // Not JSON - continue
            }


            if (
                text.indexOf("<table") !== -1 ||
                text.indexOf("report-table") !== -1
            ) {

                return {
                    table: text,
                    source: path
                };

            }


            return null;
        }


        if (
            typeof obj === "object"
        ) {

            if (
                typeof obj.table === "string" &&
                obj.table.length > 0
            ) {

                return {
                    data: obj,
                    source: path + ".table"
                };

            }


            var priorityKeys = [
                "output",
                "details",
                "result",
                "response",
                "data"
            ];


            for (
                var i = 0;
                i < priorityKeys.length;
                i++
            ) {

                var key =
                    priorityKeys[i];


                if (
                    obj[key] !== undefined &&
                    obj[key] !== null
                ) {

                    var found =
                        findPythonOutput(
                            obj[key],
                            path + "." + key,
                            depth + 1
                        );

                    if (found) {
                        return found;
                    }

                }

            }


            var keys =
                Object.keys(obj);


            for (
                var j = 0;
                j < keys.length;
                j++
            ) {

                var currentKey =
                    keys[j];


                if (
                    priorityKeys.indexOf(
                        currentKey
                    ) !== -1
                ) {
                    continue;
                }


                var result =
                    findPythonOutput(
                        obj[currentKey],
                        path + "." + currentKey,
                        depth + 1
                    );


                if (result) {
                    return result;
                }

            }

        }


        return null;
    }


    var found =
        findPythonOutput(
            response,
            "response",
            0
        );


    console.log(
        "PYTHON OUTPUT SEARCH RESULT:"
    );

    console.log(found);


    if (!found) {

        showProcessingError(
            "Python function response received, but the HTML table was not found.",
            response
        );

        return;

    }


    var data =
        found.data;


    if (
        found.table
    ) {

        data = {
            table: found.table
        };

    }


    console.log(
        "FINAL PYTHON DATA:"
    );

    console.log(data);


    if (
        data &&
        data.status === "error"
    ) {

        showProcessingError(
            "Python function returned an error.",
            data
        );

        return;

    }


    if (
        !data ||
        typeof data.table !== "string" ||
        data.table.length === 0
    ) {

        showProcessingError(
            "Python function output was found, but the HTML table is empty.",
            data
        );

        return;

    }


    displayReport(data);

}


/* =========================================================
   DISPLAY REPORT
   ========================================================= */

function displayReport(data) {

    console.log("======================================");
    console.log("DISPLAY REPORT");
    console.log("======================================");

    console.log(data);


    lastReportData = data;


    /*
       -------------------------------------------------------
       TOTAL ACCOUNTS
       -------------------------------------------------------
    */

    document.getElementById(
        "totalAccounts"
    ).innerText =

        formatNumber(
            data.total_accounts
        );


    /*
       -------------------------------------------------------
       ACCOUNTS WITH DEAL
       -------------------------------------------------------
    */

    document.getElementById(
        "accountsWithDeals"
    ).innerText =

        formatNumber(
            data.unique_accounts_with_deal
        );


    /*
       -------------------------------------------------------
       ACCOUNTS WITHOUT DEAL
       -------------------------------------------------------
    */

    var totalAccounts =
        Number(
            data.total_accounts || 0
        );

    var accountsWithDeal =
        Number(
            data.unique_accounts_with_deal || 0
        );

    var accountsWithoutDeal =
        totalAccounts -
        accountsWithDeal;


    document.getElementById(
        "accountsWithoutDeals"
    ).innerText =

        formatNumber(
            accountsWithoutDeal
        );


    /*
       -------------------------------------------------------
       TOUCHED ACCOUNTS
       -------------------------------------------------------
    */

    document.getElementById(
        "touchedAccounts"
    ).innerText =

        formatNumber(
            data.accounts_with_owner_calls
        );


    /*
       -------------------------------------------------------
       HTML TABLE
       -------------------------------------------------------
    */

    document.getElementById(
        "report"
    ).innerHTML =

        '<div class="success">' +

        'Report loaded successfully.' +

        '</div>' +

        '<div class="table-wrapper">' +

        data.table +

        '</div>';


    /*
       -------------------------------------------------------
       OWNER FILTER DROPDOWN
       -------------------------------------------------------
    */

    populateOwnerFilter();

    document.getElementById("ownerFilter").value = "";


    /*
       -------------------------------------------------------
       LAST UPDATED
       -------------------------------------------------------
    */

    var updatedLabel = data.generated_time
        ? data.generated_time
        : new Date().toLocaleString("en-IN");

    document.getElementById(
        "lastUpdated"
    ).innerText =

        "Last Updated: " + updatedLabel;


    console.log(
        "REPORT DISPLAYED SUCCESSFULLY"
    );

}


/* =========================================================
   OWNER FILTER
   ========================================================= */

function populateOwnerFilter() {

    var select = document.getElementById("ownerFilter");

    select.innerHTML = '<option value="">All Owners</option>';

    var ownerCells = document.querySelectorAll(
        ".report-table tbody tr:not(.grand-total) td.owner"
    );

    ownerCells.forEach(function(cell) {

        var name = cell.innerText.trim();

        var option = document.createElement("option");
        option.value = name;
        option.innerText = name;

        select.appendChild(option);

    });

}


function filterByOwner() {

    var selected = document.getElementById("ownerFilter").value;

    var rows = document.querySelectorAll(".report-table tbody tr");

    rows.forEach(function(row) {

        var isGrandTotal = row.classList.contains("grand-total");
        var ownerCell = row.querySelector("td.owner");
        var ownerName = ownerCell ? ownerCell.innerText.trim() : "";

        if (!selected) {

            row.style.display = "";

        } else if (isGrandTotal) {

            row.style.display = "none";

        } else {

            row.style.display = (ownerName === selected) ? "" : "none";

        }

    });


    if (!selected) {

        if (lastReportData) {

            document.getElementById("totalAccounts").innerText =
                formatNumber(lastReportData.total_accounts);

            document.getElementById("accountsWithDeals").innerText =
                formatNumber(lastReportData.unique_accounts_with_deal);

            document.getElementById("accountsWithoutDeals").innerText =
                formatNumber(
                    Number(lastReportData.total_accounts || 0) -
                    Number(lastReportData.unique_accounts_with_deal || 0)
                );

            document.getElementById("touchedAccounts").innerText =
                formatNumber(lastReportData.accounts_with_owner_calls);

        }

        return;

    }


    var targetRow = Array.from(
        document.querySelectorAll(".report-table tbody tr")
    ).find(function(row) {

        var cell = row.querySelector("td.owner");
        return cell && cell.innerText.trim() === selected;

    });


    if (targetRow) {

        var cells = targetRow.cells;

        // Column order: Owner(0), Total(1), Last30(2), 31-60(3), 60+(4),
        // Touched(5), Non-Touched(6), With Deal(7), No Deal(8), ...stages
        var total = Number(cells[1].innerText) || 0;
        var touched = Number(cells[5].innerText) || 0;
        var withDeal = Number(cells[7].innerText) || 0;

        document.getElementById("totalAccounts").innerText =
            formatNumber(total);

        document.getElementById("accountsWithDeals").innerText =
            formatNumber(withDeal);

        document.getElementById("accountsWithoutDeals").innerText =
            formatNumber(total - withDeal);

        document.getElementById("touchedAccounts").innerText =
            formatNumber(touched);

    }

}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showProcessingError(
    message,
    data
) {

    var report =
        document.getElementById(
            "report"
        );


    var debugText = "";


    try {

        debugText =
            JSON.stringify(
                data,
                null,
                2
            );

    }

    catch (e) {

        debugText =
            String(data);

    }


    report.innerHTML =

        '<div class="error">' +

        '<b>' +

        escapeHtml(
            message
        ) +

        '</b>' +

        '<br><br>' +

        '<b>Debug Response:</b>' +

        '<pre style="' +
        'white-space:pre-wrap;' +
        'word-break:break-word;' +
        'margin-top:10px;' +
        '">' +

        escapeHtml(
            debugText
        ) +

        '</pre>' +

        '</div>';


    console.error(
        message
    );

    console.error(
        data
    );

}


/* =========================================================
   NUMBER FORMAT
   ========================================================= */

function formatNumber(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return "0";

    }


    var number =
        Number(value);


    if (
        isNaN(number)
    ) {

        return String(value);

    }


    return number.toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
