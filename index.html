<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Owner Activity Report</title>

    <!-- Zoho CRM Widget SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #1f2937;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .refresh-section {
            margin-top: 15px;
        }

        #refreshButton {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #refreshButton:hover {
            background: #1d4ed8;
        }

        #refreshButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        .report-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .report-header h2 {
            margin: 0;
            font-size: 20px;
            color: #1f2937;
        }

        .last-updated {
            font-size: 12px;
            color: #6b7280;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 650px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        table {
            border-collapse: collapse;
            min-width: 2200px;
            width: max-content;
            background: #ffffff;
        }

        th,
        td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: center;
            white-space: nowrap;
            font-size: 12px;
        }

        th {
            background: #e5e7eb;
            font-weight: bold;
            color: #111827;
        }

        thead tr:first-child th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #dbeafe;
        }

        thead tr:nth-child(2) th {
            position: sticky;
            top: 38px;
            z-index: 2;
            background: #eff6ff;
        }

        tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        tbody tr:hover {
            background: #f3f4f6;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        .error {
            padding: 20px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 14px;
        }

        .success {
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            color: #166534;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .summary-cards {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .report-section {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>Account Owner Activity Report</h1>

        <p>
            Owner-wise Account, Deal and Activity Summary
        </p>

        <div class="refresh-section">

            <button id="refreshButton" onclick="loadReport()">
                Refresh Report
            </button>

        </div>

    </div>


    <!-- SUMMARY CARDS -->
    <div class="summary-cards">

        <div class="card">
            <div class="card-title">
                Total Accounts
            </div>

            <div class="card-value" id="totalAccounts">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Accounts With Deal
            </div>

            <div class="card-value" id="accountsWithDeals">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Accounts Without Deal
            </div>

            <div class="card-value" id="accountsWithoutDeals">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Touched Accounts
            </div>

            <div class="card-value" id="touchedAccounts">
                -
            </div>
        </div>

    </div>


    <!-- REPORT -->
    <div class="report-section">

        <div class="report-header">

            <h2>
                Account Owner Summary
            </h2>

            <div
                class="last-updated"
                id="lastUpdated">
                Last Updated: -
            </div>

        </div>


        <div id="report">

            <div class="loading">
                Loading report...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ZOHO PAGE LOAD
   ========================================================= */

ZOHO.embeddedApp.on(
    "PageLoad",
    function(data) {

        console.log(
            "======================================"
        );

        console.log(
            "ZOHO WIDGET PAGE LOADED"
        );

        console.log(
            "PAGE LOAD DATA:",
            data
        );

        console.log(
            "======================================"
        );

        loadReport();
    }
);


/* =========================================================
   INITIALIZE ZOHO WIDGET
   ========================================================= */

ZOHO.embeddedApp.init();


/* =========================================================
   LOAD REPORT
   ========================================================= */

function loadReport() {

    var button =
        document.getElementById(
            "refreshButton"
        );

    var report =
        document.getElementById(
            "report"
        );


    button.disabled = true;

    button.innerText =
        "Loading...";


    report.innerHTML =
        '<div class="loading">' +
        'Loading report from Zoho CRM...' +
        '</div>';


    console.log(
        "======================================"
    );

    console.log(
        "CALLING PYTHON FUNCTION"
    );

    console.log(
        "Function API Name: Account_activity_test"
    );

    console.log(
        "======================================"
    );


    /*
       Standalone Function arguments
    */

    var req_data = {

        "arguments":
            JSON.stringify({})

    };


    console.log(
        "REQUEST DATA:",
        req_data
    );


    /*
       Execute Standalone Python Function
    */

    ZOHO.CRM.FUNCTIONS.execute(

        "Account_activity_test",

        req_data

    )

    .then(

        function(response) {

            console.log(
                "======================================"
            );

            console.log(
                "FULL ZOHO FUNCTION RESPONSE"
            );

            console.log(
                "======================================"
            );

            console.log(
                response
            );


            /*
               VERY IMPORTANT:
               Print complete response as JSON
               so we can identify the exact
               Zoho response structure.
            */

            try {

                console.log(
                    "RESPONSE JSON:"
                );

                console.log(
                    JSON.stringify(
                        response,
                        null,
                        2
                    )
                );

            }
            catch (jsonError) {

                console.error(
                    "Could not stringify response:",
                    jsonError
                );

            }


            processResponse(response);

        }

    )

    .catch(

        function(error) {

            console.error(
                "======================================"
            );

            console.error(
                "PYTHON FUNCTION ERROR"
            );

            console.error(
                error
            );

            console.error(
                "======================================"
            );


            var errorMessage =
                "Unable to load Python report.";


            try {

                errorMessage =
                    JSON.stringify(
                        error,
                        null,
                        2
                    );

            }
            catch (e) {

                errorMessage =
                    String(error);

            }


            report.innerHTML =

                '<div class="error">' +

                '<b>Unable to load Python report.</b>' +

                '<br><br>' +

                '<pre style="white-space:pre-wrap;">' +

                escapeHtml(
                    errorMessage
                ) +

                '</pre>' +

                '</div>';

        }

    )

    .finally(

        function() {

            button.disabled = false;

            button.innerText =
                "Refresh Report";

        }

    );

}


/* =========================================================
   PROCESS ZOHO FUNCTION RESPONSE
   ========================================================= */

function processResponse(response) {

    console.log(
        "======================================"
    );

    console.log(
        "PROCESSING RESPONSE"
    );

    console.log(
        "======================================"
    );


    var data = null;


    /*
       -------------------------------------------------------
       CASE 1
       response.details.output
       -------------------------------------------------------
    */

    if (
        response &&
        response.details &&
        response.details.output !== undefined &&
        response.details.output !== null
    ) {

        console.log(
            "Found output at: response.details.output"
        );

        data =
            response.details.output;

    }


    /*
       -------------------------------------------------------
       CASE 2
       response.output
       -------------------------------------------------------
    */

    else if (
        response &&
        response.output !== undefined &&
        response.output !== null
    ) {

        console.log(
            "Found output at: response.output"
        );

        data =
            response.output;

    }


    /*
       -------------------------------------------------------
       CASE 3
       response.details
       -------------------------------------------------------
    */

    else if (
        response &&
        response.details
    ) {

        console.log(
            "Found data at: response.details"
        );

        data =
            response.details;

    }


    /*
       -------------------------------------------------------
       CASE 4
       Whole response
       -------------------------------------------------------
    */

    else if (response) {

        console.log(
            "Using complete response object"
        );

        data =
            response;

    }


    /*
       -------------------------------------------------------
       NO DATA
       -------------------------------------------------------
    */

    if (
        data === null ||
        data === undefined
    ) {

        showProcessingError(
            "No valid data received from Python function.",
            response
        );

        return;

    }


    console.log(
        "RAW RESULT:",
        data
    );

    console.log(
        "RAW RESULT TYPE:",
        typeof data
    );


    /*
       -------------------------------------------------------
       PARSE STRING JSON
       -------------------------------------------------------
    */

    if (
        typeof data === "string"
    ) {

        try {

            data =
                JSON.parse(data);

            console.log(
                "Parsed string JSON successfully:",
                data
            );

        }

        catch (e) {

            console.error(
                "JSON parse failed:",
                e
            );

            showProcessingError(
                "Python function returned text, but it is not valid JSON.",
                data
            );

            return;

        }

    }


    /*
       -------------------------------------------------------
       HANDLE NESTED OUTPUT
       -------------------------------------------------------
    */

    if (
        data &&
        typeof data === "object"
    ) {

        /*
           Sometimes output can itself contain
           another output property.
        */

        if (
            data.output !== undefined &&
            data.output !== null
        ) {

            console.log(
                "Nested output detected."
            );

            if (
                typeof data.output === "string"
            ) {

                try {

                    var nestedData =
                        JSON.parse(
                            data.output
                        );

                    if (
                        nestedData &&
                        typeof nestedData === "object"
                    ) {

                        data =
                            nestedData;

                    }

                }

                catch (e) {

                    console.log(
                        "Nested output is not JSON."
                    );

                }

            }

            else if (
                typeof data.output === "object"
            ) {

                data =
                    data.output;

            }

        }

    }


    console.log(
        "FINAL RESULT:",
        data
    );


    /*
       -------------------------------------------------------
       CHECK PYTHON STATUS
       -------------------------------------------------------
    */

    if (
        data &&
        data.status === "error"
    ) {

        showProcessingError(
            "Python function returned an error.",
            data
        );

        return;

    }


    /*
       -------------------------------------------------------
       VALIDATE TABLE
       -------------------------------------------------------
    */

    if (
        !data ||
        typeof data !== "object"
    ) {

        showProcessingError(
            "No valid data object received from Python function.",
            data
        );

        return;

    }


    if (
        !data.table ||
        typeof data.table !== "string"
    ) {

        console.error(
            "TABLE NOT FOUND"
        );

        console.error(
            "Available response keys:",
            Object.keys(data)
        );


        showProcessingError(
            "Python function response received, but the HTML table was not found.",
            data
        );

        return;

    }


    /*
       -------------------------------------------------------
       DISPLAY REPORT
       -------------------------------------------------------
    */

    console.log(
        "DISPLAYING REPORT"
    );


    displayReport(data);

}


/* =========================================================
   DISPLAY REPORT
   ========================================================= */

function displayReport(data) {

    console.log(
        "======================================"
    );

    console.log(
        "DISPLAY REPORT"
    );

    console.log(
        data
    );

    console.log(
        "======================================"
    );


    /*
       Total Accounts
    */

    document.getElementById(
        "totalAccounts"
    ).innerText =

        formatNumber(
            data.total_accounts
        );


    /*
       Accounts With Deal
    */

    document.getElementById(
        "accountsWithDeals"
    ).innerText =

        formatNumber(
            data.accounts_with_deals
        );


    /*
       Accounts Without Deal
    */

    document.getElementById(
        "accountsWithoutDeals"
    ).innerText =

        formatNumber(
            data.accounts_without_deals
        );


    /*
       Touched Accounts
    */

    document.getElementById(
        "touchedAccounts"
    ).innerText =

        formatNumber(
            data.touched_accounts
        );


    /*
       HTML TABLE
    */

    document.getElementById(
        "report"
    ).innerHTML =

        '<div class="success">' +

        'Report loaded successfully.' +

        '</div>' +

        '<div class="table-wrapper">' +

        data.table +

        '</div>';


    /*
       Last Updated
    */

    var now =
        new Date();


    document.getElementById(
        "lastUpdated"
    ).innerText =

        "Last Updated: " +
        now.toLocaleString();


    console.log(
        "REPORT DISPLAYED SUCCESSFULLY"
    );

}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showProcessingError(
    message,
    data
) {

    var report =
        document.getElementById(
            "report"
        );


    var debugText = "";


    try {

        debugText =
            JSON.stringify(
                data,
                null,
                2
            );

    }

    catch (e) {

        debugText =
            String(data);

    }


    report.innerHTML =

        '<div class="error">' +

        '<b>' +

        escapeHtml(
            message
        ) +

        '</b>' +

        '<br><br>' +

        '<b>Debug Response:</b>' +

        '<pre style="' +
        'white-space:pre-wrap;' +
        'word-break:break-word;' +
        'margin-top:10px;' +
        '">' +

        escapeHtml(
            debugText
        ) +

        '</pre>' +

        '</div>';


    console.error(
        message
    );

    console.error(
        data
    );

}


/* =========================================================
   NUMBER FORMAT
   ========================================================= */

function formatNumber(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return "0";

    }


    var number =
        Number(value);


    if (
        isNaN(number)
    ) {

        return String(value);

    }


    return number.toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
