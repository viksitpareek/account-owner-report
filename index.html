<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Account Owner Activity Report</title>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.refresh-btn {
    background: #1677ff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.refresh-btn:hover {
    background: #095dcc;
}

.refresh-btn:disabled {
    background: #999;
    cursor: not-allowed;
}

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    border-radius: 8px;
    padding: 18px;
    min-width: 170px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.10);
}

.card-title {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.card-value {
    font-size: 26px;
    font-weight: bold;
}

.report-container {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.10);
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 650px;
}

.table-wrapper table {
    min-width: 2200px;
    border-collapse: collapse;
}

.table-wrapper th,
.table-wrapper td {
    white-space: nowrap;
}

.table-wrapper th {
    position: sticky;
    top: 0;
    z-index: 2;
}

.loading {
    text-align: center;
    padding: 40px;
    font-size: 16px;
    color: #777;
}

.error {
    background: #ffe6e6;
    color: #b00020;
    padding: 15px;
    border-radius: 6px;
    margin-top: 20px;
}

.last-updated {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
}

</style>

</head>


<body>


<div class="header">

    <div class="title">
        Account Owner Activity Report
    </div>

    <button
        id="refreshButton"
        class="refresh-btn"
        onclick="loadReport()">

        Refresh Report

    </button>

</div>



<div class="cards">

    <div class="card">

        <div class="card-title">
            Total Accounts
        </div>

        <div
            class="card-value"
            id="totalAccounts">

            -

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Accounts With Deal
        </div>

        <div
            class="card-value"
            id="accountsWithDeals">

            -

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Accounts Without Deal
        </div>

        <div
            class="card-value"
            id="accountsWithoutDeals">

            -

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Touched Accounts
        </div>

        <div
            class="card-value"
            id="touchedAccounts">

            -

        </div>

    </div>

</div>



<div class="report-container">

    <div
        id="report"
        class="loading">

        Loading report...

    </div>

    <div
        id="lastUpdated"
        class="last-updated">

    </div>

</div>



<script>


/* =====================================================
   PAGE LOAD
   ===================================================== */

ZOHO.embeddedApp.on("PageLoad", function(data) {

    console.log("ZOHO WIDGET PAGE LOADED");

    console.log(data);

    loadReport();

});


ZOHO.embeddedApp.init();



/* =====================================================
   LOAD REPORT
   ===================================================== */

function loadReport() {

    var button =
        document.getElementById("refreshButton");

    var report =
        document.getElementById("report");


    button.disabled = true;

    button.innerText = "Loading...";


    report.innerHTML =
        '<div class="loading">' +
        'Loading report from Zoho CRM...' +
        '</div>';


    console.log(
        "Calling Python Function: pythone_fun_test"
    );


    /*
       IMPORTANT:
       Zoho expects arguments in req_data
    */

    var req_data = {

        "arguments": JSON.stringify({})

    };


    ZOHO.CRM.FUNCTIONS.execute(
        "pythone_fun_test",
        req_data
    )


    .then(function(response) {

        console.log(
            "=============================="
        );

        console.log(
            "FULL ZOHO FUNCTION RESPONSE"
        );

        console.log(
            "=============================="
        );

        console.log(response);


        processResponse(response);

    })


    .catch(function(error) {

        console.error(
            "PYTHON FUNCTION ERROR"
        );

        console.error(error);


        report.innerHTML =

            '<div class="error">' +

            '<b>Unable to load Python report.</b>' +

            '<br><br>' +

            JSON.stringify(error) +

            '</div>';

    })


    .finally(function() {

        button.disabled = false;

        button.innerText =
            "Refresh Report";

    });

}



/* =====================================================
   PROCESS RESPONSE
   ===================================================== */

function processResponse(response) {

    console.log(
        "=============================="
    );

    console.log(
        "PROCESSING FUNCTION RESPONSE"
    );

    console.log(
        "=============================="
    );


    try {

        /*
           STEP 1

           Get details.output
        */

        var output = null;


        if (
            response &&
            response.details &&
            response.details.output !== undefined
        ) {

            output =
                response.details.output;

        }


        console.log(
            "details.output:"
        );

        console.log(output);


        console.log(
            "details.output TYPE:"
        );

        console.log(typeof output);



        /*
           STEP 2

           Convert output to JSON object
        */

        var data;


        if (typeof output === "string") {

            /*
               Remove unnecessary whitespace
            */

            output =
                output.trim();


            console.log(
                "Parsing output JSON..."
            );


            try {

                data =
                    JSON.parse(output);

            }

            catch(error) {

                console.error(
                    "JSON PARSE ERROR"
                );

                console.error(error);

                console.log(
                    "Raw output:"
                );

                console.log(output);


                throw new Error(
                    "Zoho returned text, but it is not valid JSON."
                );

            }

        }

        else {

            data = output;

        }



        /*
           STEP 3

           Some Zoho responses may contain
           another output property
        */

        if (
            data &&
            data.output !== undefined
        ) {

            console.log(
                "Nested output detected"
            );


            var nested =
                data.output;


            if (
                typeof nested === "string"
            ) {

                try {

                    data =
                        JSON.parse(nested);

                }

                catch(e) {

                    console.log(
                        "Nested output is not JSON"
                    );

                }

            }

            else {

                data =
                    nested;

            }

        }



        /*
           STEP 4

           Final data validation
        */

        console.log(
            "=============================="
        );

        console.log(
            "FINAL DATA OBJECT"
        );

        console.log(
            "=============================="
        );

        console.log(data);


        if (
            !data ||
            typeof data !== "object"
        ) {

            throw new Error(
                "No valid data received from Python function."
            );

        }



        /*
           STEP 5

           Check table
        */

        console.log(
            "TABLE VALUE:"
        );

        console.log(
            data.table
        );


        console.log(
            "TABLE TYPE:"
        );

        console.log(
            typeof data.table
        );



        /*
           STEP 6

           Display report
        */

        displayReport(data);

    }


    catch(error) {

        console.error(
            "PROCESSING ERROR:"
        );

        console.error(error);


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="error">' +

            '<b>Error processing Python response.</b>' +

            '<br><br>' +

            error.message +

            '</div>';

    }

}



/* =====================================================
   DISPLAY REPORT
   ===================================================== */

function displayReport(data) {


    console.log(
        "DISPLAYING FINAL REPORT"
    );


    /*
       TOTAL ACCOUNTS
    */

    document.getElementById(
        "totalAccounts"
    ).innerText =

        data.total_accounts !== undefined

        ? data.total_accounts

        : "-";



    /*
       ACCOUNTS WITH DEAL
    */

    document.getElementById(
        "accountsWithDeals"
    ).innerText =

        data.accounts_with_deals !== undefined

        ? data.accounts_with_deals

        : "-";



    /*
       ACCOUNTS WITHOUT DEAL
    */

    document.getElementById(
        "accountsWithoutDeals"
    ).innerText =

        data.accounts_without_deals !== undefined

        ? data.accounts_without_deals

        : "-";



    /*
       TOUCHED ACCOUNTS
    */

    document.getElementById(
        "touchedAccounts"
    ).innerText =

        data.touched_accounts !== undefined

        ? data.touched_accounts

        : "-";



    /*
       TABLE
    */

    if (
        data.table &&
        typeof data.table === "string" &&
        data.table.trim() !== ""
    ) {


        console.log(
            "TABLE FOUND - RENDERING"
        );


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="table-wrapper">' +

            data.table +

            '</div>';


    }

    else {


        console.error(
            "TABLE NOT FOUND"
        );


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="error">' +

            '<b>Python function executed successfully, ' +
            'but table data is missing.</b>' +

            '<br><br>' +

            'Available fields: ' +

            Object.keys(data).join(", ") +

            '</div>';

    }



    /*
       LAST UPDATED
    */

    var now =
        new Date();


    document.getElementById(
        "lastUpdated"
    ).innerText =

        "Last Updated: " +

        now.toLocaleString();

}


</script>

</body>

</html>
