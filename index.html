<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

var FILTER_DEALS_BY_YEAR = true;
var DEAL_YEAR_FIELD = "Year2";
var DEAL_YEAR_FILTER = "2026-2027";


/* =========================================================
   STATE
   ========================================================= */

var lastReportData = null;


/* =========================================================
   ZOHO PAGE LOAD
   ========================================================= */

ZOHO.embeddedApp.on(
    "PageLoad",
    function(data) {

        console.log(
            "======================================"
        );

        console.log(
            "ZOHO WIDGET PAGE LOADED"
        );

        console.log(
            "PAGE LOAD DATA:",
            data
        );

        console.log(
            "======================================"
        );

        loadReport();
    }
);


/* =========================================================
   INITIALIZE ZOHO WIDGET
   ========================================================= */

ZOHO.embeddedApp.init();


/* =========================================================
   LOAD REPORT
   ========================================================= */

function loadReport() {

    var button =
        document.getElementById(
            "refreshButton"
        );

    var report =
        document.getElementById(
            "report"
        );


    button.disabled = true;

    button.innerText =
        "Loading...";


    report.innerHTML =
        '<div class="loading">' +
        'Loading report from Zoho CRM...' +
        '</div>';


    console.log(
        "======================================"
    );

    console.log(
        "CALLING PYTHON FUNCTION"
    );

    console.log(
        "Function API Name: account_owner_report_reader"
    );

    console.log(
        "======================================"
    );


    /*
       Standalone Function arguments
    */

    var req_data = {

        "arguments":
            JSON.stringify({})

    };


    console.log(
        "REQUEST DATA:",
        req_data
    );


    /*
       Execute the lightweight reader function
       (reads the cache written by the scheduled writer function)
    */

    ZOHO.CRM.FUNCTIONS.execute(

        "account_owner_report_reader",

        req_data

    )

    .then(

        function(response) {

            console.log(
                "======================================"
            );

            console.log(
                "FULL ZOHO FUNCTION RESPONSE"
            );

            console.log(
                "======================================"
            );

            console.log(
                response
            );


            try {

                console.log(
                    "RESPONSE JSON:"
                );

                console.log(
                    JSON.stringify(
                        response,
                        null,
                        2
                    )
                );

            }
            catch (jsonError) {

                console.error(
                    "Could not stringify response:",
                    jsonError
                );

            }


            processResponse(response);

        }

    )

    .catch(

        function(error) {

            console.error(
                "======================================"
            );

            console.error(
                "PYTHON FUNCTION ERROR"
            );

            console.error(
                error
            );

            console.error(
                "======================================"
            );


            var errorMessage =
                "Unable to load Python report.";


            try {

                errorMessage =
                    JSON.stringify(
                        error,
                        null,
                        2
                    );

            }
            catch (e) {

                errorMessage =
                    String(error);

            }


            report.innerHTML =

                '<div class="error">' +

                '<b>Unable to load Python report.</b>' +

                '<br><br>' +

                '<pre style="white-space:pre-wrap;">' +

                escapeHtml(
                    errorMessage
                ) +

                '</pre>' +

                '</div>';

        }

    )

    .finally(

        function() {

            button.disabled = false;

            button.innerText =
                "Refresh Report";

        }

    );

}


/* =========================================================
   PROCESS ZOHO FUNCTION RESPONSE
   ========================================================= */

function processResponse(response) {

    console.log("======================================");
    console.log("PROCESSING RESPONSE");
    console.log("======================================");

    console.log("FULL RESPONSE:");
    console.log(response);


    /*
       -------------------------------------------------------
       Find the Python output anywhere inside the
       Zoho response object.
       -------------------------------------------------------
    */

    function findPythonOutput(obj, path, depth) {

        if (depth > 10) {
            return null;
        }

        if (
            obj === null ||
            obj === undefined
        ) {
            return null;
        }


        if (typeof obj === "string") {

            var text = obj.trim();

            try {

                var parsed =
                    JSON.parse(text);

                var result =
                    findPythonOutput(
                        parsed,
                        path + " [parsed]",
                        depth + 1
                    );

                if (result) {
                    return result;
                }

            }
            catch (e) {
                // Not JSON - continue
            }


            if (
                text.indexOf("<table") !== -1 ||
                text.indexOf("report-table") !== -1
            ) {

                return {
                    table: text,
                    source: path
                };

            }


            return null;
        }


        if (
            typeof obj === "object"
        ) {

            if (
                typeof obj.table === "string" &&
                obj.table.length > 0
            ) {

                return {
                    data: obj,
                    source: path + ".table"
                };

            }


            var priorityKeys = [
                "output",
                "details",
                "result",
                "response",
                "data"
            ];


            for (
                var i = 0;
                i < priorityKeys.length;
                i++
            ) {

                var key =
                    priorityKeys[i];


                if (
                    obj[key] !== undefined &&
                    obj[key] !== null
                ) {

                    var found =
                        findPythonOutput(
                            obj[key],
                            path + "." + key,
                            depth + 1
                        );

                    if (found) {
                        return found;
                    }

                }

            }


            var keys =
                Object.keys(obj);


            for (
                var j = 0;
                j < keys.length;
                j++
            ) {

                var currentKey =
                    keys[j];


                if (
                    priorityKeys.indexOf(
                        currentKey
                    ) !== -1
                ) {
                    continue;
                }


                var result =
                    findPythonOutput(
                        obj[currentKey],
                        path + "." + currentKey,
                        depth + 1
                    );


                if (result) {
                    return result;
                }

            }

        }


        return null;
    }


    var found =
        findPythonOutput(
            response,
            "response",
            0
        );


    console.log(
        "PYTHON OUTPUT SEARCH RESULT:"
    );

    console.log(found);


    if (!found) {

        showProcessingError(
            "Python function response received, but the HTML table was not found.",
            response
        );

        return;

    }


    var data =
        found.data;


    if (
        found.table
    ) {

        data = {
            table: found.table
        };

    }


    console.log(
        "FINAL PYTHON DATA:"
    );

    console.log(data);


    if (
        data &&
        data.status === "error"
    ) {

        showProcessingError(
            "Python function returned an error.",
            data
        );

        return;

    }


    if (
        !data ||
        typeof data.table !== "string" ||
        data.table.length === 0
    ) {

        showProcessingError(
            "Python function output was found, but the HTML table is empty.",
            data
        );

        return;

    }


    displayReport(data);

}


/* =========================================================
   DISPLAY REPORT
   ========================================================= */

function displayReport(data) {

    console.log("======================================");
    console.log("DISPLAY REPORT");
    console.log("======================================");

    console.log(data);


    lastReportData = data;


    /*
       -------------------------------------------------------
       TOTAL ACCOUNTS
       -------------------------------------------------------
    */

    document.getElementById(
        "totalAccounts"
    ).innerText =

        formatNumber(
            data.total_accounts
        );


    /*
       -------------------------------------------------------
       ACCOUNTS WITH DEAL
       -------------------------------------------------------
    */

    document.getElementById(
        "accountsWithDeals"
    ).innerText =

        formatNumber(
            data.unique_accounts_with_deal
        );


    /*
       -------------------------------------------------------
       ACCOUNTS WITHOUT DEAL
       -------------------------------------------------------
    */

    var totalAccounts =
        Number(
            data.total_accounts || 0
        );

    var accountsWithDeal =
        Number(
            data.unique_accounts_with_deal || 0
        );

    var accountsWithoutDeal =
        totalAccounts -
        accountsWithDeal;


    document.getElementById(
        "accountsWithoutDeals"
    ).innerText =

        formatNumber(
            accountsWithoutDeal
        );


    /*
       -------------------------------------------------------
       TOUCHED ACCOUNTS
       -------------------------------------------------------
    */

    document.getElementById(
        "touchedAccounts"
    ).innerText =

        formatNumber(
            data.accounts_with_owner_calls
        );


    /*
       -------------------------------------------------------
       HTML TABLE
       -------------------------------------------------------
    */

    document.getElementById(
        "report"
    ).innerHTML =

        '<div class="success">' +

        'Report loaded successfully.' +

        '</div>' +

        '<div class="table-wrapper">' +

        data.table +

        '</div>';


    /*
       -------------------------------------------------------
       OWNER FILTER DROPDOWN
       -------------------------------------------------------
    */

    populateOwnerFilter();
    attachDrilldownHandlers();

    document.getElementById("ownerFilter").value = "";


    /*
       -------------------------------------------------------
       LAST UPDATED
       -------------------------------------------------------
    */

    var updatedLabel = data.generated_time
        ? data.generated_time
        : new Date().toLocaleString("en-IN");

    document.getElementById(
        "lastUpdated"
    ).innerText =

        "Last Updated: " + updatedLabel;


    console.log(
        "REPORT DISPLAYED SUCCESSFULLY"
    );

}


/* =========================================================
   OWNER FILTER
   ========================================================= */

/* =========================================================
   DRILL-DOWN
   ========================================================= */

var drilldownLabels = {
    "total": "Total Accounts",
    "last_30": "Touched in Last 30 Days",
    "days_31_60": "Touched 31-60 Days Ago",
    "days_60_plus": "Touched 60+ Days Ago",
    "touched": "Touched Accounts",
    "non_touched": "Non-Touched Accounts",
    "with_deal": "Accounts With Deal",
    "no_deal": "Accounts Without Deal"
};

function attachDrilldownHandlers() {

    var cells = document.querySelectorAll(".report-table td.drillable");

    cells.forEach(function(cell) {

        cell.onclick = function() {

            var count = parseInt(cell.innerText, 10) || 0;

            if (count === 0) {
                return; // nothing to show
            }

            var row = cell.closest("tr");
            var ownerCell = row ? row.querySelector("td.owner") : null;

            var ownerId = ownerCell ? ownerCell.getAttribute("data-owner-id") : null;
            var ownerName = ownerCell ? ownerCell.innerText.trim() : "";
            var category = cell.getAttribute("data-cat");

            if (!ownerId) {
                return; // owner has no id on record, can't drill down
            }

            openDrilldown(ownerId, ownerName, category);
        };

    });

}


function categoryLabel(category) {

    if (category.indexOf("stage:") === 0) {
        return category.substring(6) + " Deals";
    }

    return drilldownLabels[category] || category;

}


function openDrilldown(ownerId, ownerName, category) {

    var modal = document.getElementById("drilldownModal");
    var title = document.getElementById("drilldownTitle");
    var body = document.getElementById("drilldownBody");

    title.innerText = ownerName + " - " + categoryLabel(category);
    body.innerHTML = "Loading...";

    modal.classList.add("open");

    runDrilldownClientSide(ownerId, category)

        .then(function(accounts) {

            if (accounts.length === 0) {
                body.innerHTML =
                    '<div class="modal-empty">No matching accounts found.</div>';
                return;
            }

            var listHtml = '<ul style="list-style:none;padding:0;">';
            accounts.forEach(function(account) {
                listHtml +=
                    '<li class="drilldown-account-link" data-account-id="' +
                    escapeHtml(account.id) + '" style="padding:6px 0;color:#1a73e8;cursor:pointer;">' +
                    escapeHtml(account.name) +
                    '</li>';
            });
            listHtml += "</ul>";

            body.innerHTML = listHtml;

            body.querySelectorAll(".drilldown-account-link").forEach(function(el) {
                el.onclick = function() {
                    ZOHO.CRM.UI.Record.open({
                        Entity: "Accounts",
                        RecordID: el.getAttribute("data-account-id")
                    });
                };
            });

        })

        .catch(function(error) {

            body.innerHTML =
                '<div class="modal-empty">Failed to load accounts.</div>';

            console.error("Drilldown error:", error);

        });

}


/* =========================================================
   CLIENT-SIDE DRILLDOWN (no Python function needed)

   Runs the same accounts -> calls -> deals -> categorize logic
   as the drilldown Python function, but directly from the widget
   using ZOHO.CRM.API.searchRecord. Scoped to one owner's accounts,
   so this stays fast even though it's client-side.
   ========================================================= */

function zohoSearchAll(module, criteria) {

    // Paginated fetch using the confirmed-working page/per_page
    // style, rather than page_token - no 10-second constraint here
    // since this runs in the browser, not a serverless function.

    return new Promise(function(resolve) {

        var allRecords = [];
        var page = 1;

        function fetchPage() {

            var searchPromise = criteria
                ? ZOHO.CRM.API.searchRecord({
                    Entity: module,
                    Type: "criteria",
                    Query: criteria,
                    page: page,
                    per_page: 200
                })
                : ZOHO.CRM.API.getAllRecords({
                    Entity: module,
                    sort_order: "asc",
                    page: page,
                    per_page: 200
                });

            searchPromise
                .then(function(response) {

                    if (response && response.data) {
                        allRecords = allRecords.concat(response.data);
                    }

                    if (response && response.info && response.info.more_records === true && page < 100) {
                        page++;
                        fetchPage();
                    } else {
                        resolve(allRecords);
                    }
                })
                .catch(function() {
                    // searchRecord rejects on zero matches - treat as end of results
                    resolve(allRecords);
                });
        }

        fetchPage();
    });
}


function lookupId(value) {
    if (value && typeof value === "object") {
        return String(value.id || "");
    }
    return String(value || "");
}


function parseDateSafe(value) {
    if (!value) return null;
    var d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
}


async function runDrilldownClientSide(ownerId, category) {

    // ------------------------------------------------------------
    // Accounts owned by this owner
    // ------------------------------------------------------------

    var accounts = await zohoSearchAll(
        "Accounts",
        "(Owner:equals:" + ownerId + ")"
    );

    var accountById = {};
    accounts.forEach(function(a) {
        if (a.id) {
            accountById[String(a.id)] = { id: String(a.id), name: a.Account_Name || "" };
        }
    });

    var accountIds = Object.keys(accountById);

    if (accountIds.length === 0) {
        return [];
    }

    // ------------------------------------------------------------
    // Calls made by this owner
    // ------------------------------------------------------------

    var calls = await zohoSearchAll(
        "Calls",
        "(Owner:equals:" + ownerId + ")"
    );

    var latestCallByAccount = {};

    calls.forEach(function(call) {
        var whatId = lookupId(call.What_Id);
        if (!whatId || !accountById[whatId]) return;

        var callDate = parseDateSafe(call.Call_Start_Time);
        if (!callDate) return;

        if (!latestCallByAccount[whatId] || callDate > latestCallByAccount[whatId]) {
            latestCallByAccount[whatId] = callDate;
        }
    });

    // ------------------------------------------------------------
    // Deals - fetch ALL org deals (matches the writer's own logic,
    // which links via Account_Name regardless of deal owner), then
    // filter client-side to this owner's accounts. No batching
    // needed - browser JS has no 10-second execution limit.
    // ------------------------------------------------------------

    var allDeals = await zohoSearchAll("Deals", null);

    var latestDealByAccount = {};

    allDeals.forEach(function(deal) {

        var accId = lookupId(deal.Account_Name);
        if (!accId || !accountById[accId]) return;

        if (FILTER_DEALS_BY_YEAR) {
            var dealYear = String(deal[DEAL_YEAR_FIELD] || "").trim();
            if (dealYear !== DEAL_YEAR_FILTER) return;
        }

        var dealDate = parseDateSafe(deal.Modified_Time) || parseDateSafe(deal.Created_Time);
        if (!dealDate) return;

        var existing = latestDealByAccount[accId];
        if (!existing || dealDate > existing.date) {
            latestDealByAccount[accId] = { date: dealDate, stage: deal.Stage || "Unknown" };
        }
    });

    // ------------------------------------------------------------
    // Categorize
    // ------------------------------------------------------------

    var now = new Date();
    var matches = [];

    accountIds.forEach(function(accId) {

        var account = accountById[accId];
        var latestCall = latestCallByAccount[accId];
        var latestDeal = latestDealByAccount[accId];

        var touched = !!latestCall;
        var agingBucket = null;

        if (touched) {
            var daysOld = (now - latestCall) / 86400000;
            if (daysOld <= 30) agingBucket = "last_30";
            else if (daysOld <= 60) agingBucket = "days_31_60";
            else agingBucket = "days_60_plus";
        }

        var withDeal = !!latestDeal;
        var stage = latestDeal ? latestDeal.stage : null;

        var isMatch = false;

        if (category === "total") isMatch = true;
        else if (category === "touched") isMatch = touched;
        else if (category === "non_touched") isMatch = !touched;
        else if (["last_30", "days_31_60", "days_60_plus"].indexOf(category) !== -1) isMatch = (agingBucket === category);
        else if (category === "with_deal") isMatch = withDeal;
        else if (category === "no_deal") isMatch = !withDeal;
        else if (category.indexOf("stage:") === 0) isMatch = withDeal && stage === category.substring(6);

        if (isMatch) matches.push({ id: account.id, name: account.name });

    });

    matches.sort(function(a, b) { return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); });

    return matches;

}


function closeDrilldown() {
    document.getElementById("drilldownModal").classList.remove("open");
}


function populateOwnerFilter() {

    var select = document.getElementById("ownerFilter");

    select.innerHTML = '<option value="">All Owners</option>';

    var ownerCells = document.querySelectorAll(
        ".report-table tbody tr:not(.grand-total) td.owner"
    );

    ownerCells.forEach(function(cell) {

        var name = cell.innerText.trim();

        var option = document.createElement("option");
        option.value = name;
        option.innerText = name;

        select.appendChild(option);

    });

}


function filterByOwner() {

    var selected = document.getElementById("ownerFilter").value;

    var rows = document.querySelectorAll(".report-table tbody tr");

    rows.forEach(function(row) {

        var isGrandTotal = row.classList.contains("grand-total");
        var ownerCell = row.querySelector("td.owner");
        var ownerName = ownerCell ? ownerCell.innerText.trim() : "";

        if (!selected) {

            row.style.display = "";

        } else if (isGrandTotal) {

            row.style.display = "none";

        } else {

            row.style.display = (ownerName === selected) ? "" : "none";

        }

    });


    if (!selected) {

        if (lastReportData) {

            document.getElementById("totalAccounts").innerText =
                formatNumber(lastReportData.total_accounts);

            document.getElementById("accountsWithDeals").innerText =
                formatNumber(lastReportData.unique_accounts_with_deal);

            document.getElementById("accountsWithoutDeals").innerText =
                formatNumber(
                    Number(lastReportData.total_accounts || 0) -
                    Number(lastReportData.unique_accounts_with_deal || 0)
                );

            document.getElementById("touchedAccounts").innerText =
                formatNumber(lastReportData.accounts_with_owner_calls);

        }

        return;

    }


    var targetRow = Array.from(
        document.querySelectorAll(".report-table tbody tr")
    ).find(function(row) {

        var cell = row.querySelector("td.owner");
        return cell && cell.innerText.trim() === selected;

    });


    if (targetRow) {

        var cells = targetRow.cells;

        // Column order: Owner(0), Total(1), Last30(2), 31-60(3), 60+(4),
        // Touched(5), Non-Touched(6), With Deal(7), No Deal(8), ...stages
        var total = Number(cells[1].innerText) || 0;
        var touched = Number(cells[5].innerText) || 0;
        var withDeal = Number(cells[7].innerText) || 0;

        document.getElementById("totalAccounts").innerText =
            formatNumber(total);

        document.getElementById("accountsWithDeals").innerText =
            formatNumber(withDeal);

        document.getElementById("accountsWithoutDeals").innerText =
            formatNumber(total - withDeal);

        document.getElementById("touchedAccounts").innerText =
            formatNumber(touched);

    }

}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showProcessingError(
    message,
    data
) {

    var report =
        document.getElementById(
            "report"
        );


    var debugText = "";


    try {

        debugText =
            JSON.stringify(
                data,
                null,
                2
            );

    }

    catch (e) {

        debugText =
            String(data);

    }


    report.innerHTML =

        '<div class="error">' +

        '<b>' +

        escapeHtml(
            message
        ) +

        '</b>' +

        '<br><br>' +

        '<b>Debug Response:</b>' +

        '<pre style="' +
        'white-space:pre-wrap;' +
        'word-break:break-word;' +
        'margin-top:10px;' +
        '">' +

        escapeHtml(
            debugText
        ) +

        '</pre>' +

        '</div>';


    console.error(
        message
    );

    console.error(
        data
    );

}


/* =========================================================
   NUMBER FORMAT
   ========================================================= */

function formatNumber(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return "0";

    }


    var number =
        Number(value);


    if (
        isNaN(number)
    ) {

        return String(value);

    }


    return number.toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
