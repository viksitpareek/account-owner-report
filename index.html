<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Owner Activity Report</title>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.refresh-btn {
    background: #1677ff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.refresh-btn:hover {
    background: #095dcc;
}

.refresh-btn:disabled {
    background: #999;
    cursor: not-allowed;
}


/* SUMMARY CARDS */

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    border-radius: 8px;
    padding: 18px;
    min-width: 170px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.10);
}

.card-title {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.card-value {
    font-size: 26px;
    font-weight: bold;
}


/* REPORT */

.report-container {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.10);
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 650px;
}


/* PYTHON TABLE */

.table-wrapper table {
    min-width: 2200px;
    border-collapse: collapse;
}

.table-wrapper th,
.table-wrapper td {
    white-space: nowrap;
}

.table-wrapper th {
    position: sticky;
    top: 0;
    z-index: 2;
}

.table-wrapper td {
    padding: 7px;
}


/* LOADING */

.loading {
    text-align: center;
    padding: 40px;
    font-size: 16px;
    color: #777;
}


/* ERROR */

.error {
    background: #ffe6e6;
    color: #b00020;
    padding: 15px;
    border-radius: 6px;
    margin-top: 20px;
}


/* LAST UPDATED */

.last-updated {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="title">
        Account Owner Activity Report
    </div>

    <button
        id="refreshButton"
        class="refresh-btn"
        onclick="loadReport()">

        Refresh Report

    </button>

</div>



<!-- SUMMARY CARDS -->

<div class="cards">

    <div class="card">

        <div class="card-title">
            Total Accounts
        </div>

        <div
            class="card-value"
            id="totalAccounts">

            -

        </div>

    </div>



    <div class="card">

        <div class="card-title">
            Accounts With Deal
        </div>

        <div
            class="card-value"
            id="accountsWithDeals">

            -

        </div>

    </div>



    <div class="card">

        <div class="card-title">
            Accounts Without Deal
        </div>

        <div
            class="card-value"
            id="accountsWithoutDeals">

            -

        </div>

    </div>



    <div class="card">

        <div class="card-title">
            Touched Accounts
        </div>

        <div
            class="card-value"
            id="touchedAccounts">

            -

        </div>

    </div>

</div>



<!-- REPORT -->

<div class="report-container">

    <div
        id="report"
        class="loading">

        Loading report...

    </div>

    <div
        id="lastUpdated"
        class="last-updated">

    </div>

</div>



<script>


/* =====================================================
   ZOHO PAGE LOAD
   ===================================================== */

ZOHO.embeddedApp.on("PageLoad", function(data) {

    console.log("=================================");
    console.log("ZOHO WIDGET LOADED");
    console.log("=================================");

    console.log("Page Data:");
    console.log(data);

    loadReport();

});


/* =====================================================
   INITIALIZE ZOHO WIDGET
   ===================================================== */

ZOHO.embeddedApp.init();



/* =====================================================
   LOAD PYTHON REPORT
   ===================================================== */

function loadReport() {

    var button =
        document.getElementById("refreshButton");

    var report =
        document.getElementById("report");


    /* Disable refresh button */

    button.disabled = true;

    button.innerText = "Loading...";


    /* Loading message */

    report.innerHTML =
        '<div class="loading">' +
        'Loading report from Zoho CRM...' +
        '</div>';


    console.log("=================================");
    console.log("CALLING PYTHON FUNCTION");
    console.log("Function: pythone_fun_test");
    console.log("=================================");


    /*
       CALL PYTHON FUNCTION
    */

    ZOHO.CRM.FUNCTIONS.execute(
        "pythone_fun_test",
        {
        arguments: JSON.stringify({})
    }
    )

    .then(function(response) {

        console.log("=================================");
        console.log("FULL PYTHON FUNCTION RESPONSE");
        console.log("=================================");

        console.log(response);


        processResponse(response);

    })


    .catch(function(error) {

        console.error("=================================");
        console.error("PYTHON FUNCTION ERROR");
        console.error("=================================");

        console.error(error);


        report.innerHTML =
            '<div class="error">' +

            '<b>Unable to load report.</b>' +

            '<br><br>' +

            '<b>Python Function:</b> ' +
            'pythone_fun_test' +

            '<br><br>' +

            '<b>Error:</b><br>' +

            JSON.stringify(error) +

            '</div>';


    })


    .finally(function() {

        button.disabled = false;

        button.innerText = "Refresh Report";

    });

}



/* =====================================================
   PROCESS PYTHON RESPONSE
   ===================================================== */

function processResponse(response) {

    console.log("=================================");
    console.log("PROCESSING RESPONSE");
    console.log("=================================");


    try {

        var result = response;


        /*
           CASE 1

           Zoho returns:

           response.details.output
        */

        if (
            response &&
            response.details &&
            response.details.output
        ) {

            console.log(
                "Found response.details.output"
            );

            result =
                response.details.output;

        }


        console.log("RAW RESULT:");

        console.log(result);

        console.log(
            "RAW RESULT TYPE:",
            typeof result
        );


        /*
           CASE 2

           Output is JSON string
        */

        if (typeof result === "string") {

            result = result.trim();


            try {

                result =
                    JSON.parse(result);

                console.log(
                    "JSON successfully parsed"
                );

            }

            catch (e) {

                console.log(
                    "JSON parsing failed"
                );

            }

        }


        /*
           CASE 3

           Sometimes another output property exists
        */

        if (
            result &&
            result.output
        ) {

            console.log(
                "Found nested output"
            );


            var nestedOutput =
                result.output;


            if (
                typeof nestedOutput === "string"
            ) {

                try {

                    result =
                        JSON.parse(nestedOutput);

                }

                catch (e) {

                    result =
                        nestedOutput;

                }

            }

            else {

                result =
                    nestedOutput;

            }

        }


        console.log("=================================");
        console.log("FINAL RESULT");
        console.log("=================================");

        console.log(result);


        /*
           Validate response
        */

        if (
            !result ||
            typeof result !== "object"
        ) {

            throw new Error(
                "Python function did not return a valid JSON object."
            );

        }


        /*
           Display report
        */

        displayReport(result);


    }

    catch(error) {

        console.error(
            "RESPONSE PROCESSING ERROR:",
            error
        );


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="error">' +

            '<b>Error processing report.</b>' +

            '<br><br>' +

            error.message +

            '</div>';

    }

}



/* =====================================================
   DISPLAY REPORT
   ===================================================== */

function displayReport(data) {

    console.log("=================================");
    console.log("DISPLAYING REPORT");
    console.log("=================================");

    console.log(data);


    /*
       TOTAL ACCOUNTS
    */

    if (
        data.total_accounts !== undefined
    ) {

        document.getElementById(
            "totalAccounts"
        ).innerText =
            data.total_accounts;

    }


    /*
       ACCOUNTS WITH DEAL
    */

    if (
        data.accounts_with_deals !== undefined
    ) {

        document.getElementById(
            "accountsWithDeals"
        ).innerText =
            data.accounts_with_deals;

    }


    /*
       ACCOUNTS WITHOUT DEAL
    */

    if (
        data.accounts_without_deals !== undefined
    ) {

        document.getElementById(
            "accountsWithoutDeals"
        ).innerText =
            data.accounts_without_deals;

    }


    /*
       TOUCHED ACCOUNTS
    */

    if (
        data.touched_accounts !== undefined
    ) {

        document.getElementById(
            "touchedAccounts"
        ).innerText =
            data.touched_accounts;

    }


    /*
       DISPLAY HTML TABLE
    */

    if (
        data.table &&
        typeof data.table === "string" &&
        data.table.trim().length > 0
    ) {

        console.log(
            "================================="
        );

        console.log(
            "TABLE FOUND"
        );

        console.log(
            "Rendering Python HTML table..."
        );

        console.log(
            "================================="
        );


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="table-wrapper">' +

            data.table +

            '</div>';

    }


    /*
       TABLE NOT FOUND
    */

    else {

        console.error(
            "TABLE NOT FOUND"
        );

        console.log(
            "Available response keys:"
        );

        console.log(
            Object.keys(data)
        );


        document.getElementById(
            "report"
        ).innerHTML =

            '<div class="error">' +

            '<b>Python function executed successfully, ' +
            'but no table was returned.</b>' +

            '<br><br>' +

            'Available fields: ' +

            Object.keys(data).join(", ") +

            '</div>';

    }


    /*
       LAST UPDATED
    */

    var now =
        new Date();


    document.getElementById(
        "lastUpdated"
    ).innerText =

        "Last Updated: " +

        now.toLocaleString();

}


</script>

</body>

</html>
